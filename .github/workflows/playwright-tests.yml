name: Playwright E2E Tests

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Start application and run tests
        run: |
          npm run server > backend.log 2>&1 &
          npm start > frontend.log 2>&1 &

          npx --yes wait-on http://localhost:3000

          npx playwright test --workers=1 --reporter=html

      - name: Show frontend log on failure
        if: failure()
        run: cat frontend.log

      - name: Show backend log on failure
        if: failure()
        run: cat backend.log

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
